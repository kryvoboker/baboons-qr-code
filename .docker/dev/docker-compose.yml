name: "qr-code"

services:
  qr-code-php-fpm:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/php/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: qr-code-php-fpm:1.0
    container_name: qr-code-php-fpm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
      - ../../.docker/dev/env/.env.qr-renderer
    volumes:
      - ../../httpdocs/backend:/var/www/html
      - ../../storage:/var/www/storage
      - ../../xhprof:/var/www/xhprof
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      qr-code-postgresql:
        condition: service_healthy
      qr-code-qr-renderer:
        condition: service_healthy
    networks:
      - qr-code-net

  qr-code-cron:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/cron/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: qr-code-cron:1.0-alpine
    container_name: qr-code-cron
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../httpdocs/backend:/var/www/html:ro
      - ../../storage:/var/www/storage
      - ../../.docker/dev/cron/crontabs:/etc/crontabs
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      qr-code-php-fpm:
        condition: service_started
      qr-code-postgresql:
        condition: service_healthy
    networks:
      - qr-code-net

  qr-code-nginx:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: qr-code-nginx:1.0-alpine-slim
    container_name: qr-code-nginx
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qr-code-nginx.rule=Host(`dev.api.qr-code.com`)"
      - "traefik.http.routers.qr-code-nginx.entrypoints=web"
      - "traefik.http.services.qr-code-nginx.loadbalancer.server.port=80"
    volumes:
      - ../../httpdocs/backend:/var/www/html:ro
      - ../../storage:/var/www/storage:ro
      - ../../.docker/dev/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../httpdocs/frontend/public/images/social:/var/www/qr-social:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - qr-code-php-fpm
    networks:
      - traefik-network
      - qr-code-net

  qr-code-nodejs:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/nodejs/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: node
    image: qr-code-nodejs:1.0-slim
    container_name: qr-code-nodejs
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.qr-renderer
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.strateg-frontend-dev.rule=Host(`dev.qr-code.com`)"
      - "traefik.http.routers.strateg-frontend-dev.entrypoints=web"
      - "traefik.http.services.strateg-frontend-dev.loadbalancer.server.port=3000"
    ports:
      - "3000:3000"  # Nuxt
      - "9229:9229"  # Node inspector
    volumes:
      - ../../httpdocs/frontend:/var/www/html
      - ../../storage:/var/www/storage
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      qr-code-qr-renderer:
        condition: service_healthy
    networks:
      - traefik-network
      - qr-code-net

  qr-code-postgresql:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/postgresql/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: postgres
    image: qr-code-postgresql:1.0-alpine
    container_name: qr-code-postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=$${POSTGRES_SIMPLE_USER} --dbname=$${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 1
    ports:
      - "3351:5432"
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.postgresql
    volumes:
      - ../../.db/postgresql:/var/lib/postgresql
    init: true # Ensures proper signal handling and zombie reaping
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - qr-code-net

  qr-code-qr-renderer:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/qr-renderer/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    container_name: qr-code-qr-renderer
    image: qr-code-qr-renderer:1.0-slim
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env.qr-renderer
    volumes:
      - ../../httpdocs/qr-renderer:/var/www/html:ro
      - ../../storage/app/public:/shared/storage/app/public
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,nosuid
      - /home/node/.npm:size=128m,nosuid
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      qr-code-net:
        aliases:
          - qr-renderer

  qr-code-redis:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/redis/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: redis
    image: qr-code-redis:1.0-alpine
    container_name: qr-code-redis
    restart: unless-stopped
    ports:
      - "42608:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ../../.db/redis:/data
    init: true # Ensures proper signal handling and zombie reaping
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - qr-code-net

networks:
  traefik-network:
    name: traefik-network
    driver: bridge
    external: true
  qr-code-net:
    name: qr-code-net
    driver: bridge
    external: true